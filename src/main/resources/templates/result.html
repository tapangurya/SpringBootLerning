<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Berlin Data</title>
<style>
/* General Styling */
body {
	font-family: Arial, sans-serif;
	background-color: #222;
	color: white;
	display: flex;
	flex-direction: column;
	align-items: center;
	/* justify-content: center; */
	height: 90vh;
}

h2 {
	color: #00ffcc;
}

/* Table Styling */
table {
	width: 60%;
	border-collapse: collapse;
	background-color: #333;
	color: white;
	border-radius: 10px;
	overflow: hidden;
	box-shadow: 0px 4px 10px rgba(0, 255, 204, 0.5);
	margin-top: 5px;
}

th, td {
	padding: 12px;
	text-align: center;
	border: 1px solid #444;
}

th {
	background-color: #00ffcc;
	color: black;
}
/* Row Hover Effect */
tr:hover{
	background-color: rgba(0, 255, 204, 0.3);
	transition: 0.3s ease-in-out;
}

button {
            background-color:  #333;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: box-shadow 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }
         button:hover {
           background-color: rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.7);
            transition: 0.3s ease-in-out;
            
        } 
        
        
        button a {
            text-decoration: none;
            color: white;
        }
</style>
</head>

<body>

	<h2>Berlin Data</h2>
	<table th:if="${berlinData}">
		<tr>
			<th>Id</th>
			<th>Name</th>
			<th>Email</th>
			<th>Password</th>
		</tr>
		<tr>
			<td th:text="${berlinData.id}"></td>
			<td th:text="${berlinData.name}"></td>
			<td th:text="${berlinData.email}"></td>
			<td th:text="${berlinData.password}"></td>
		</tr>
	</table>
	<button> <a href="index" style="text-decoration: none; color: white">Home</a> </button>

</body>
</html>
