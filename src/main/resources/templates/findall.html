<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FindAll</title>
    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* justify-content: center; */
            height: 100vh;
        }

        h2 {
            color: #00ffcc;
        }

        p {
            font-size: 18px;
        }

        /* Table Styling */
        table {
            width: 60%;
            border-collapse: collapse;
            background-color: #333;
            color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 255, 204, 0.5);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #444;
        }

        th {
            background-color: #00ffcc;
            color: black;
        }

        /* Row Hover Effect */
        tr:hover {
            background-color: rgba(0, 255, 204, 0.3);
            transition: 0.3s ease-in-out;
        }

        /* Error Message */
        p[style*="color: red;"] {
            font-weight: bold;
        }

        /* Button Styling */
        .glow-button {
            background-color: #00ffcc;
            color: black;
            border: none;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 10px #00ffcc;
        }

        .glow-button:hover {
            box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            transform: scale(1.1);
        }
        div{
        padding-top:30px;
        width:400px;
        display: flex;
        justify-content: space-evenly;
        }
    </style>
</head>
<body>
    <h2>Berlin Data</h2>

    <!-- <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p> -->

    <table border="1" th:if="${berlinDatas}">
        <tr>
        	<th>Id</th>
        	<th>Name</th>
            <th>Email</th>
            <th>Password</th>
        </tr>
        <tr th:each="b : ${berlinDatas}">
        	<td th:text="${b.id}"></td>
        	<td th:text="${b.name}"></td>
            <td th:text="${b.email}"></td>
            <td th:text="${b.password}"></td>
        </tr>
    </table>
<div>
	 <a href="findAll" style="text-decoration: none"><button class="glow-button" >Refresh</button></a>
     <a href="index" style="text-decoration: none"><button class="glow-button">Home</button></a> 
</div>
    <!-- Glowing Button -->
   

</body>
</html>
